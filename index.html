<!DOCTYPE html>
<html lang="ja">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CGC FIELD ANSWER</title>

<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL'
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'
const ADMIN_PASSWORD = 'cgc12345'

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
)
</script>

<style>
body{
  font-family:-apple-system,sans-serif;
  background:#f5f7fb;
  margin:0;
  color:#111827;
}

header{
  background:#03122f;
  color:white;
  padding:24px;
}

.hero{
  font-size:14px;
  opacity:0.8;
  margin-top:10px;
}

.container{
  padding:16px;
}

.search-box{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.search-box input{
  flex:1;
  padding:16px;
  border-radius:14px;
  border:none;
}

.search-box button{
  border:none;
  background:#2563eb;
  color:white;
  padding:16px 20px;
  border-radius:14px;
  font-weight:700;
}

.section{
  margin-top:30px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-top:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.tag{
  display:inline-block;
  background:#dbeafe;
  color:#1d4ed8;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  margin-top:10px;
}

input,textarea,select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #d1d5db;
  margin-top:10px;
  box-sizing:border-box;
}

textarea{
  min-height:120px;
}

.btn{
  width:100%;
  border:none;
  background:#2563eb;
  color:white;
  padding:16px;
  border-radius:14px;
  margin-top:14px;
  font-weight:700;
}

.btn-red{
  background:#dc2626;
}

.material{
  text-decoration:none;
  color:#111827;
  display:block;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#03122f;
  display:flex;
  justify-content:space-around;
  padding:12px;
}

.bottom-nav a{
  color:white;
  text-decoration:none;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h1>CGC FIELD ANSWER</h1>
  <div class="hero" id="heroQuote"></div>

  <div class="search-box">
    <input
      id="searchInput"
      placeholder="検索..."
      onkeydown="if(event.key==='Enter')searchKnowledge()"
    >

    <button onclick="searchKnowledge()">
      検索
    </button>
  </div>
</header>

<div class="container">

  <div class="section">
    <h2>検索結果</h2>
    <div id="results"></div>
  </div>

  <div class="section">
    <h2>回答案投稿</h2>

    <div class="card">

      <input id="proposalQuestion" placeholder="質問">

      <select id="proposalCategory">
        <option>新電力</option>
        <option>WS</option>
        <option>VOD</option>
        <option>営業</option>
      </select>

      <textarea
        id="proposalAnswer"
        placeholder="回答案"
      ></textarea>

      <input
        id="proposalUrl"
        placeholder="参考URL（任意）"
      >

      <button
        class="btn"
        onclick="submitProposal()"
      >
        投稿する
      </button>

    </div>
  </div>

  <div class="section">
    <h2>教材ライブラリ</h2>

    <div id="materialsList"></div>
  </div>

  <div class="section">
    <h2>管理</h2>

    <div id="adminArea"></div>
  </div>

  <div class="section">
    <h2>未回答</h2>

    <div id="requestList"></div>
  </div>

</div>

<div class="bottom-nav">
  <a href="#">検索</a>
  <a href="#materialsList">教材</a>
  <a href="#adminArea">管理</a>
</div>

<script>

let knowledge = []
let requests = []
let proposals = []
let materials = []

const quotes = [
  "即答できる営業は強い",
  "知識は武器になる",
  "営業は反応速度",
  "現場を止めない",
  "検索一発で即回答",
  "迷わない営業へ",
  "知識共有が組織を強くする"
]

const synonymGroups = [
  ["明細","請求","請求書","検針票"],
  ["解約","違約金","解約金","キャンセル"],
  ["ws","ウォーターサーバー","水"],
  ["vod","動画","映画","配信"],
  ["後確認","後確","確認電話"]
]

function normalize(text){
  return String(text || '')
    .toLowerCase()
    .replace(/ /g,'')
}

function expandTerms(word){

  const result = new Set([normalize(word)])

  synonymGroups.forEach(group=>{

    const hit = group.some(
      x=>normalize(word).includes(normalize(x))
    )

    if(hit){
      group.forEach(
        x=>result.add(normalize(x))
      )
    }
  })

  return [...result]
}

function setHero(){

  document.getElementById('heroQuote')
    .innerText =
      quotes[
        Math.floor(Math.random()*quotes.length)
      ]
}

async function loadData(){

  const answers =
    await supabaseClient
      .from('回答')
      .select('*')

  const unanswered =
    await supabaseClient
      .from('未回答')
      .select('*')

  const proposalData =
    await supabaseClient
      .from('回答案')
      .select('*')

  const materialData =
    await supabaseClient
      .from('教材')
      .select('*')

  knowledge = answers.data || []
  requests = unanswered.data || []
  proposals = proposalData.data || []
  materials = materialData.data || []

  renderRequests()
  renderAdmin()
  renderMaterials()
}

function searchKnowledge(){

  const word =
    document.getElementById('searchInput').value

  const terms = expandTerms(word)

  const filtered =
    knowledge.filter(item=>{

      const text =
        normalize(
          item['質問'] +
          item['答え']
        )

      return terms.some(
        term=>text.includes(term)
      )
    })

  const results =
    document.getElementById('results')

  if(filtered.length === 0){

    results.innerHTML = `
      <div class="card">
        回答なし

        <button
          class="btn"
          onclick="submitRequest('${word}')"
        >
          未回答として送信
        </button>
      </div>
    `

    return
  }

  results.innerHTML =
    filtered.map(item=>`

      <div class="card">

        <h3>${item['質問']}</h3>

        <p>${item['答え']}</p>

        <div class="tag">
          ${item['カテゴリ']}
        </div>

        ${
          item['参考URL']
          ? `
            <a
              href="${item['参考URL']}"
              target="_blank"
            >
              参考URL
            </a>
          `
          : ''
        }

      </div>

    `).join('')
}

async function submitRequest(word){

  await supabaseClient
    .from('未回答')
    .insert([{
      '質問':word
    }])

  alert('送信しました')

  await loadData()
}

async function submitProposal(){

  const question =
    document.getElementById('proposalQuestion').value

  const category =
    document.getElementById('proposalCategory').value

  const answer =
    document.getElementById('proposalAnswer').value

  const url =
    document.getElementById('proposalUrl').value

  await supabaseClient
    .from('回答案')
    .insert([{
      '質問':question,
      'カテゴリ':category,
      '答え':answer,
      '参考URL':url,
      '状態':'審査中'
    }])

  alert('投稿完了')

  await loadData()
}

function renderAdmin(){

  const admin =
    document.getElementById('adminArea')

  admin.innerHTML = `

    <div class="card">

      <input
        type="password"
        id="adminPassword"
        placeholder="管理パスワード"
      >

      <button
        class="btn"
        onclick="unlockAdmin()"
      >
        管理画面を開く
      </button>

    </div>
  `
}

function unlockAdmin(){

  const pass =
    document.getElementById('adminPassword').value

  if(pass !== ADMIN_PASSWORD){

    alert('パスワード違います')
    return
  }

  const pending =
    proposals.filter(
      x=>x['状態']==='審査中'
    )

  document.getElementById('adminArea')
    .innerHTML =
      pending.map(item=>`

        <div class="card">

          <input
            id="q_${item.id}"
            value="${item['質問']}"
          >

          <textarea
            id="a_${item.id}"
          >${item['答え']}</textarea>

          <input
            id="u_${item.id}"
            value="${item['参考URL'] || ''}"
          >

          <button
            class="btn"
            onclick="publish('${item.id}')"
          >
            編集して公開
          </button>

          <button
            class="btn btn-red"
            onclick="reject('${item.id}')"
          >
            却下
          </button>

        </div>

      `).join('')
}

async function publish(id){

  const question =
    document.getElementById(`q_${id}`).value

  const answer =
    document.getElementById(`a_${id}`).value

  const url =
    document.getElementById(`u_${id}`).value

  const target =
    proposals.find(x=>x.id == id)

  await supabaseClient
    .from('回答')
    .insert([{
      '質問':question,
      '答え':answer,
      'カテゴリ':target['カテゴリ'],
      '参考URL':url
    }])

  await supabaseClient
    .from('回答案')
    .update({
      '状態':'公開済み'
    })
    .eq('id',id)

  alert('公開しました')

  await loadData()
}

async function reject(id){

  await supabaseClient
    .from('回答案')
    .update({
      '状態':'却下'
    })
    .eq('id',id)

  alert('却下しました')

  await loadData()
}

function renderRequests(){

  document.getElementById('requestList')
    .innerHTML =
      requests.map(item=>`

        <div class="card">
          ${item['質問']}
        </div>

      `).join('')
}

function renderMaterials(){

  document.getElementById('materialsList')
    .innerHTML =
      materials.map(item=>`

        <a
          class="card material"
          href="${item['URL']}"
          target="_blank"
        >

          <div class="tag">
            ${item['種別']}
          </div>

          <h3>${item['タイトル']}</h3>

          <p>${item['カテゴリ']}</p>

        </a>

      `).join('')
}

window.onload = async ()=>{

  setHero()

  await loadData()
}
</script>

</body>
</html>
