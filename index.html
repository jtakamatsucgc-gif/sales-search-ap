<!DOCTYPE html>
<html lang="ja">
<head>

<script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f7fb;
  color:#07142f;

  min-height:100vh;
  line-height:1.6;

  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(95px + env(safe-area-inset-bottom));

  overflow-x:hidden;
}

.hero{
  background:linear-gradient(90deg,#021331,#1f4fb7);
  color:white;
  padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top));
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
}

.logo{
  width:72px;
  height:72px;
  border-radius:18px;
}

.hero-top{
  display:flex;
  align-items:center;
  gap:16px;
}

.hero-title{
  font-size:22px;
  font-weight:800;
}

.hero-sub{
  margin-top:20px;
  font-size:18px;
  font-weight:700;
}

.search-wrap{
  margin-top:24px;
  display:flex;
  gap:10px;
}

.search-input{
  flex:1;
  height:72px;
  border:none;
  border-radius:24px;
  padding:0 20px;
  font-size:20px;
}

.search-btn{
  width:120px;
  border:none;
  border-radius:24px;
  background:#1560ff;
  color:white;
  font-size:22px;
  font-weight:700;
}

.tag-row{
  display:flex;
  gap:10px;
  overflow:auto;
  margin-top:18px;
}

.tag{
  min-width:max-content;
  padding:12px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  color:white;
  font-weight:700;
}

.page{
  display:none;
  padding:22px;
}

.page.active{
  display:block;
}

.card{
  background:white;
  border-radius:24px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.section-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

.input{
  width:100%;
  border:2px solid #dbe2ef;
  border-radius:20px;
  padding:18px;
  font-size:18px;
  margin-bottom:16px;
}

.textarea{
  width:100%;
  border:2px solid #dbe2ef;
  border-radius:20px;
  padding:18px;
  font-size:18px;
  min-height:180px;
  margin-bottom:16px;
}

.button{
  width:100%;
  height:64px;
  border:none;
  border-radius:20px;
  background:#1560ff;
  color:white;
  font-size:20px;
  font-weight:800;
}

.result-card{
  background:white;
  border-radius:24px;
  padding:24px;
  margin-top:18px;
}

.result-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:10px;
}

.result-tag{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  background:#edf3ff;
  color:#1560ff;
  font-weight:700;
  margin-bottom:12px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#021331;
  display:flex;
  justify-content:space-around;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  z-index:999;
}

.nav-btn{
  background:none;
  border:none;
  color:white;
  font-size:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav-icon{
  font-size:24px;
}

</style>
</head>

<body>

<div class="hero">

  <div class="hero-top">
    <img class="logo" src="https://raw.githubusercontent.com/jtakamatsucg-gif/sales-search-ap/main/icon.png">

    <div>
      <div class="hero-title">CGC FIELD ANSWER</div>
      <div style="opacity:.85;font-weight:700;margin-top:4px;">
        知識共有が組織を強くする。
      </div>
    </div>
  </div>

  <div class="hero-sub" id="heroText">
    答えを持つ者が勝つ。
  </div>

  <div class="search-wrap">
    <input id="searchInput" class="search-input" placeholder="例：紙の請求書 / 解約金 / WS">
    <button class="search-btn" onclick="searchAnswers()">検索</button>
  </div>

  <div class="tag-row">
    <div class="tag">⚡️ 新電力</div>
    <div class="tag">💧 WS</div>
    <div class="tag">🎬 VOD</div>
    <div class="tag">📄 契約</div>
    <div class="tag">🔢 明細</div>
    <div class="tag">💰 料金</div>
    <div class="tag">💲 解約金</div>
    <div class="tag">🏃‍♂️‍➡️ 営業</div>
    <div class="tag">🔥 クレーム</div>
  </div>

</div>

<!-- 検索 -->
<div id="page-search" class="page active">

  <div class="card">
    <div class="section-title">検索結果</div>
    <div id="results"></div>
  </div>

</div>

<!-- 投稿 -->
<div id="page-post" class="page">

  <div class="card">

    <div class="section-title">回答案を投稿</div>

    <input id="question" class="input" placeholder="質問・キーワード">

    <select id="category" class="input">
      <option>⚡️ 新電力</option>
      <option>💧 WS</option>
      <option>🎬 VOD</option>
      <option>📄 契約</option>
      <option>🔢 明細</option>
      <option>💰 料金</option>
      <option>💲 解約金</option>
      <option>🏃‍♂️‍➡️ 営業</option>
      <option>🔥 クレーム</option>
    </select>

    <textarea id="answer" class="textarea" placeholder="回答案"></textarea>

    <input id="url" class="input" placeholder="参考URL">

    <button class="button" onclick="postAnswer()">
      回答案を投稿する
    </button>

  </div>

</div>

<!-- 教材 -->
<div id="page-material" class="page">

  <div class="card">

    <div class="section-title">教材追加</div>

    <input id="materialTitle" class="input" placeholder="タイトル">

    <input id="materialUrl" class="input" placeholder="URL">

    <select id="materialType" class="input">
      <option>動画</option>
      <option>PDF</option>
      <option>マニュアル</option>
    </select>

    <button class="button" onclick="addMaterial()">
      教材を追加
    </button>

  </div>

</div>

<div class="bottom-nav">

  <button class="nav-btn" onclick="switchPage('search')">
    <div class="nav-icon">🔍</div>
    <div>検索</div>
  </button>

  <button class="nav-btn" onclick="switchPage('post')">
    <div class="nav-icon">➕</div>
    <div>投稿</div>
  </button>

  <button class="nav-btn" onclick="switchPage('material')">
    <div class="nav-icon">▶️</div>
    <div>教材</div>
  </button>

</div>

<script>

const heroQuotes = [
"即答できる営業は、信頼される。 — 孫正義（実業家）",
"スピードは最大の武器だ。 — 堀江貴文（実業家）",
"まず踏み込め。迷った方が負ける。 — 前澤友作（実業家）",
"知識は、行動して初めて価値になる。 — イーロン・マスク（起業家）",
"現場を知らない戦略は弱い。 — 稲盛和夫（京セラ創業者）",
"小さな差が、大きな信頼になる。 — 松下幸之助（Panasonic創業者）",
"ハングリーであれ。愚か者であれ。 — スティーブ・ジョブズ（Apple創業者）",
"完璧を待つより、まず終わらせろ。 — マーク・ザッカーバーグ（Meta創業者）",
"未来を予測する最良の方法は、自ら創ることだ。 — ピーター・ドラッカー（経営学者）",
"知識への投資は、最高の利益を生む。 — ベンジャミン・フランクリン（政治家・発明家）",
"話すのをやめて、始めることだ。 — ウォルト・ディズニー（Disney創業者）",
"成功するまでやり続ければ、失敗ではない。 — 稲盛和夫（京セラ創業者）",
"変化を恐れるな。 — ジャック・マー（Alibaba創業者）",
"行動しながら学べ。 — リード・ホフマン（LinkedIn創業者）",
"人は、動きながら強くなる。 — 本田宗一郎（Honda創業者）",
"挑戦の数だけ、成長できる。 — 本田宗一郎（Honda創業者）",
"成功とは、情熱を失わずに失敗を重ねること。 — ウィンストン・チャーチル（元イギリス首相）",
"リスクを取らないことが、最大のリスク。 — マーク・ザッカーバーグ（Meta創業者）",
"現状維持は、後退である。 — 松下幸之助（Panasonic創業者）",
"情報を持つ者が、主導権を握る。 — 孫正義（SoftBank創業者）",
"答えを持つ営業は強い。 — 柳井正（ユニクロ創業者）",
"確認速度が営業速度。 — 三木谷浩史（楽天創業者）",
"最速で動く者が、最も多く学ぶ。 — エリック・リース（起業家・著者）",
"今やれ。 — ジョージ・パットン（米軍将軍）",
"知識は力だ。 — フランシス・ベーコン（哲学者）",
"現場に答えがある。 — 松下幸之助（Panasonic創業者）",
"勝者は、諦めなかった人だ。 — ナポレオン・ヒル（成功哲学作家）",
"知っているだけでは足りない。行動せよ。 — ゲーテ（詩人・作家）",
"決断に迷う時間を減らせ。 — ジェフ・ベゾス（Amazon創業者）",
"最短距離は、まず始めること。 — セス・ゴーディン（マーケター・著者）",
]

document.getElementById("heroText").innerText =
heroQuotes[Math.floor(Math.random()*heroQuotes.length)]

function switchPage(page){

  document.querySelectorAll(".page").forEach(el=>{
    el.classList.remove("active")
  })

  document.getElementById(`page-${page}`).classList.add("active")
}

async function searchAnswers(){

  const keyword = document.getElementById("searchInput").value

  const { data, error } = await supabaseClient
    .from("回答")
    .select("*")
    .ilike("質問", `%${keyword}%`)

  if(error){
    alert("検索失敗：" + error.message)
    return
  }

  let html = ""

  data.forEach(item=>{

    html += `
      <div class="result-card">
        <div class="result-tag">${item.カテゴリ}</div>
        <div class="result-title">${item.質問}</div>
        <div>${item.答え}</div>
      </div>
    `
  })

  document.getElementById("results").innerHTML = html
}

async function postAnswer(){

  const question = document.getElementById("question").value
  const category = document.getElementById("category").value
  const answer = document.getElementById("answer").value
  const url = document.getElementById("url").value

  const { error } = await supabaseClient
    .from("回答")
    .insert([
      {
        質問:question,
        カテゴリ:category,
        答え:answer,
        参考URL:url,
        状態:"審査中"
      }
    ])

  if(error){
    alert("投稿失敗：" + error.message)
    return
  }

  alert("投稿完了！")
}

async function addMaterial(){

  const title = document.getElementById("materialTitle").value
  const url = document.getElementById("materialUrl").value
  const type = document.getElementById("materialType").value

  const { error } = await supabaseClient
    .from("教材")
    .insert([
      {
        タイトル:title,
        URL:url,
        種別:type,
        状態:"公開"
      }
    ])

  if(error){
    alert("教材追加失敗：" + error.message)
    return
  }

  alert("教材追加完了！")
}

</script>

</body>
</html>
