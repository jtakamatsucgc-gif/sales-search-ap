<script>
let knowledge=[],requests=[],proposals=[],materials=[],currentCategory='all'

const quotes=["即答できる営業は強い。","知識は現場で武器になる。","営業は反応速度。","現場を止めない。","検索一発で即回答。","迷わない営業へ。","知識共有が組織を強くする。","答えを持つ者が勝つ。","属人化を終わらせろ。","営業の武器を統一する。"]

const synonymGroups=[
["明細","請求","請求書","検針票","web明細","紙明細"],
["料金","電気料金","電気代","単価","基本料金"],
["解約","解約金","違約金","キャンセル"],
["ws","ウォーターサーバー","水"],
["vod","動画","映画","配信"],
["契約","申込","申し込み","受注"],
["営業","商談","架電","トーク"],
["クレーム","苦情","怒り","炎上"]
]

const tagRules=[
{tag:"⚡️ 新電力",words:["新電力","電力","電気","供給地点","燃調","再エネ"]},
{tag:"💧 WS",words:["ws","ウォーターサーバー","水","ボトル","サーバー"]},
{tag:"🎬 VOD",words:["vod","動画","映画","配信","サブスク"]},
{tag:"📄 契約",words:["契約","申込","申し込み","受注","成約"]},
{tag:"🔢 明細",words:["明細","請求書","検針票","請求"]},
{tag:"💰 料金",words:["料金","電気代","単価","基本料金","金額"]},
{tag:"💲 解約金",words:["解約金","違約金","キャンセル料","解約"]},
{tag:"🏃‍♂️‍➡️ 営業",words:["営業","商談","架電","後確認","トーク"]},
{tag:"🔥 クレーム",words:["クレーム","苦情","怒り","トラブル"]}
]

function normalizeText(text){let v=String(text||'').toLowerCase();v=v.replace(/[Ａ-Ｚａ-ｚ０-９]/g,s=>String.fromCharCode(s.charCodeAt(0)-0xFEE0));[' ','　','・','／','/','-','ー','＿','_','（','）','(',')','「','」','『','』','【','】','[',']','、','。',',','.'].forEach(c=>v=v.split(c).join(''));return v}
function expandSearchTerms(input){const base=normalizeText(input);const terms=new Set([base]);synonymGroups.forEach(g=>{const ng=g.map(normalizeText);if(ng.some(w=>base.includes(w)||w.includes(base)))ng.forEach(w=>terms.add(w))});return [...terms].filter(Boolean)}
function safeText(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function safeArg(t){return String(t||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
function getQuestion(i){return i['質問']||''} function getAnswer(i){return i['答え']||''} function getCategory(i){return i['カテゴリ']||'未分類'} function getReferenceUrl(i){return i['参考URL']||''} function getStatus(i){return i['状態']||''} function getDate(i){return i.created_at?new Date(i.created_at).toLocaleString('ja-JP'):''}
function isAdmin(){return localStorage.getItem('adminUnlocked')==='true'}
function setHeroQuote(){document.getElementById('heroQuote').textContent=quotes[Math.floor(Math.random()*quotes.length)]}

function makeTags(item){
  const text=normalizeText(`${getQuestion(item)} ${getAnswer(item)} ${getCategory(item)}`)
  const tags=[]
  tagRules.forEach(r=>{if(r.words.some(w=>text.includes(normalizeText(w))))tags.push(r.tag)})
  if(tags.length===0 && getCategory(item)) tags.push(getCategory(item))
  return tags
}

function renderProposalForm(){
  document.getElementById('proposalForm').innerHTML=`<div class="panel-card"><div class="form-grid"><input id="proposalQuestion" placeholder="質問・キーワード"><select id="proposalCategory"><option>新電力</option><option>WS</option><option>VOD</option><option>営業</option><option>その他</option></select><textarea id="proposalAnswer" placeholder="回答案"></textarea><input id="proposalUrl" placeholder="参考URL（任意）"><button class="primary-btn" onclick="submitProposal()">回答案を投稿する</button><div class="status-line">投稿後すぐには公開されません。管理者確認後に公開されます。</div></div></div>`
}

function renderAdmin(){
 const a=document.getElementById('adminArea')
 if(!isAdmin()){a.innerHTML=`<div class="panel-card"><div class="form-grid"><input id="adminPassword" type="password" placeholder="管理パスコード"><button class="primary-btn" onclick="unlockAdmin()">管理画面を開く</button></div></div>`;return}
 const pending=proposals.filter(i=>!['公開済み','却下'].includes(getStatus(i)))
 a.innerHTML=`<div class="panel-card"><b>管理メニュー</b><div class="btn-row"><button class="secondary-btn" onclick="lockAdmin()">管理画面を閉じる</button></div></div>
 <div class="panel-card"><b>審査中の回答案</b>${pending.length===0?`<div class="notice">審査中の回答案はありません。</div>`:pending.map(i=>`<div class="review-box"><div class="review-label">質問</div><input id="reviewQuestion_${i.id}" value="${safeText(getQuestion(i))}"><div class="review-label">カテゴリ</div><select id="reviewCategory_${i.id}"><option ${getCategory(i)==='新電力'?'selected':''}>新電力</option><option ${getCategory(i)==='WS'?'selected':''}>WS</option><option ${getCategory(i)==='VOD'?'selected':''}>VOD</option><option ${getCategory(i)==='営業'?'selected':''}>営業</option><option ${getCategory(i)==='その他'?'selected':''}>その他</option></select><div class="review-label">回答案</div><textarea id="reviewAnswer_${i.id}">${safeText(getAnswer(i))}</textarea><div class="review-label">参考URL</div><input id="reviewUrl_${i.id}" value="${safeText(getReferenceUrl(i))}"><small>${safeText(getDate(i))}</small><div class="btn-row"><button class="primary-btn" onclick="publishProposal('${i.id}')">編集して公開</button><button class="danger-btn" onclick="rejectProposal('${i.id}')">却下</button></div></div>`).join('')}</div>
 <div class="panel-card"><b>教材追加</b><div class="form-grid"><input id="newMaterialTitle" placeholder="教材タイトル"><input id="newMaterialUrl" placeholder="YouTube / PDF / 資料URL"><select id="newMaterialType"><option>動画</option><option>PDF</option><option>資料</option></select><select id="newMaterialCategory"><option>新電力</option><option>WS</option><option>VOD</option><option>営業</option><option>後確認</option><option>その他</option></select><button class="primary-btn" onclick="addMaterial()">教材を追加する</button></div></div>`
}

function unlockAdmin(){const p=document.getElementById('adminPassword').value.trim();if(p!==ADMIN_PASSWORD){alert('パスコードが違います');return}localStorage.setItem('adminUnlocked','true');renderAdmin()}
function lockAdmin(){localStorage.removeItem('adminUnlocked');renderAdmin()}

async function loadData(){
 const answers=await supabaseClient.from('回答').select('*').order('created_at',{ascending:false})
 const unanswered=await supabaseClient.from('未回答').select('*').order('created_at',{ascending:false})
 const proposalData=await supabaseClient.from('回答案').select('*').order('created_at',{ascending:false})
 const materialData=await supabaseClient.from('教材').select('*').order('created_at',{ascending:false})
 if(answers.error){alert('回答読み込み失敗：'+answers.error.message);return}
 if(unanswered.error){alert('未回答読み込み失敗：'+unanswered.error.message);return}
 if(proposalData.error){alert('回答案読み込み失敗：'+proposalData.error.message);return}
 if(materialData.error){alert('教材読み込み失敗：'+materialData.error.message);return}
 knowledge=answers.data||[];requests=unanswered.data||[];proposals=proposalData.data||[];materials=materialData.data||[]
 updateStats();renderRequests();renderProposalForm();renderAdmin();renderMaterials();searchKnowledge(false)
}

function updateStats(){
 document.getElementById('knowledgeCount').innerText=knowledge.length
 document.getElementById('requestCount').innerText=requests.length
 document.getElementById('proposalCount').innerText=proposals.filter(i=>!['公開済み','却下'].includes(getStatus(i))).length
}

function filterCategory(c,e){currentCategory=c;document.querySelectorAll('#search .chip').forEach(x=>x.classList.remove('active'));if(e)e.classList.add('active');searchKnowledge(false)}

function searchKnowledge(scrollToResults=true){
 const raw=document.getElementById('searchInput').value.trim()
 const input=normalizeText(raw)
 const terms=expandSearchTerms(raw)
 const results=document.getElementById('results')
 if(!input){results.innerHTML=`<div class="section-head"><h2>検索結果 <span>0件</span></h2></div><div class="result-card"><div class="result-meta">検索してください</div><h3>キーワードを入力すると、登録済みナレッジを検索できます。</h3><p>例：他社電力の明細 / 解約金 / WS / VOD / 新電力</p></div>`;return}
 const filtered=knowledge.filter(i=>{const text=normalizeText(getQuestion(i)+getAnswer(i)+getCategory(i));const hit=terms.some(t=>text.includes(t));const cat=currentCategory==='all'?true:normalizeText(getCategory(i)).includes(normalizeText(currentCategory));return hit&&cat})
 if(filtered.length===0){results.innerHTML=`<div class="section-head"><h2>検索結果 <span>0件</span></h2></div><div class="result-card"><div class="result-meta">該当なし</div><h3>この質問はまだ登録されていません。</h3><p>必要であれば、未回答として送信してください。</p><div class="btn-row"><button class="primary-btn" onclick="submitRequest('${safeArg(raw)}')">この質問を送信</button></div></div>`;return}
 results.innerHTML=`<div class="section-head"><h2>検索結果 <span>${filtered.length}件</span></h2></div>`+filtered.map(i=>`<article class="result-card"><div class="result-tags">${makeTags(i).map(t=>`<span class="result-tag">${safeText(t)}</span>`).join('')}</div><h3>${safeText(getQuestion(i))}</h3><p>${safeText(getAnswer(i))}</p>${getReferenceUrl(i)?`<a class="ref-link" href="${safeText(getReferenceUrl(i))}" target="_blank">↗ 参考URLを開く</a>`:''}</article>`).join('')
 if(scrollToResults)document.getElementById('results').scrollIntoView({behavior:'smooth'})
}

async function submitRequest(text){
 if(!text){alert('検索欄に質問を入力してください');return}
 const {error}=await supabaseClient.from('未回答').insert([{'質問':text,'状態':'未対応'}])
 if(error){alert('未回答保存失敗：'+error.message);return}
 alert('未回答として保存しました');await loadData()
}

async function submitProposal(){
 const q=document.getElementById('proposalQuestion').value.trim()
 const c=document.getElementById('proposalCategory').value
 const a=document.getElementById('proposalAnswer').value.trim()
 const u=document.getElementById('proposalUrl').value.trim()
 if(!q||!a||!c){alert('質問・回答案・カテゴリを入力してください');return}
 const {error}=await supabaseClient.from('回答案').insert([{'質問':q,'答え':a,'カテゴリ':c,'参考URL':u,'状態':'審査中'}])
 if(error){alert('回答案投稿失敗：'+error.message);return}
 alert('回答案を投稿しました');document.getElementById('proposalQuestion').value='';document.getElementById('proposalAnswer').value='';document.getElementById('proposalUrl').value='';await loadData()
}

async function publishProposal(id){
 const q=document.getElementById(`reviewQuestion_${id}`).value.trim()
 const c=document.getElementById(`reviewCategory_${id}`).value
 const a=document.getElementById(`reviewAnswer_${id}`).value.trim()
 const u=document.getElementById(`reviewUrl_${id}`).value.trim()
 if(!q||!a||!c){alert('質問・回答・カテゴリは必須です');return}
 const ins=await supabaseClient.from('回答').insert([{'質問':q,'答え':a,'カテゴリ':c,'参考URL':u}])
 if(ins.error){alert('公開失敗：'+ins.error.message);return}
 const upd=await supabaseClient.from('回答案').update({'質問':q,'答え':a,'カテゴリ':c,'参考URL':u,'状態':'公開済み'}).eq('id',id)
 if(upd.error){alert('状態更新失敗：'+upd.error.message);return}
 alert('公開しました');await loadData()
}

async function rejectProposal(id){
 if(!confirm('この回答案を却下しますか？'))return
 const {error}=await supabaseClient.from('回答案').update({'状態':'却下'}).eq('id',id)
 if(error){alert('却下失敗：'+error.message);return}
 alert('却下しました');await loadData()
}

async function addMaterial(){
 const t=document.getElementById('newMaterialTitle').value.trim()
 const u=document.getElementById('newMaterialUrl').value.trim()
 const ty=document.getElementById('newMaterialType').value
 const c=document.getElementById('newMaterialCategory').value
 if(!t||!u||!ty||!c){alert('教材タイトル・URL・種別・カテゴリを入力してください');return}
 const {error}=await supabaseClient.from('教材').insert([{'タイトル':t,'URL':u,'種別':ty,'カテゴリ':c,'状態':'公開'}])
 if(error){alert('教材追加失敗：'+error.message);return}
 alert('教材を追加しました');await loadData()
}

function renderRequests(){
 const list=document.getElementById('requestList')
 if(requests.length===0){list.innerHTML=`<div class="mini-card"><b>未回答質問はありません</b></div>`;return}
 list.innerHTML=requests.map(i=>`<div class="mini-card"><b>${safeText(getQuestion(i))}</b><small>${safeText(getStatus(i))} / ${safeText(getDate(i))}</small></div>`).join('')
}

function renderMaterials(){
 const list=document.getElementById('materialsList')
 const visible=materials.filter(i=>getStatus(i)==='公開'||!getStatus(i))
 if(visible.length===0){list.innerHTML=`<div class="mini-card"><b>教材はまだありません</b><small>管理画面からYouTubeやPDFのURLを追加できます。</small></div>`;return}
 list.innerHTML=visible.map(i=>`<a class="mini-card material-card" href="${safeText(i['URL']||'')}" target="_blank"><div class="material-type">${safeText(i['種別']||'教材')}</div><div class="material-title">${safeText(i['タイトル']||'無題')}</div><div class="material-category">${safeText(getCategory(i))}</div></a>`).join('')
}

window.addEventListener('DOMContentLoaded',async()=>{setHeroQuote();renderProposalForm();renderAdmin();await loadData()})
</script>
</body>
</html>
